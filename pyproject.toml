[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "morphotrack"
version = "2.0.0"
description = "Morphotrack v2"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "tmurakami" }]
dependencies = [
    # add runtime dependencies here, e.g. "numpy", "scipy", "scikit-image"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyterlab",
]

[tool.setuptools.packages.find]
where = ["src"]
