[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "morphotrack"
version = "2.0.0"
description = "Morphotrack v2"
readme = "README.md"
requires-python = ">=3.10.16"
license = { file = "LICENSE" }
authors = [{ name = "tmurakami" }]
dependencies = [
    "numpy==1.26.4",
    "scipy==1.15.0",
    "scikit-image==0.22.0",
    "pandas==2.3.3",
    "matplotlib==3.10.0",
    "tqdm==4.67.1",
    "dask==2025.2.0",
    "zarr==2.18.3",
    "ome-zarr==0.11.1",
    "torch==2.6.0",
    "torchdiffeq==0.2.5",
    "geomloss==0.2.6",
    "pykeops==2.3",
    "open3d==0.19.0",
    "trimesh==4.6.13",
    "pyvista==0.48.4",
    "pyacvd==0.4.0",
    "napari[all]==0.5.6",
    "vispy==0.14.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "jupyterlab",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]
